    <script>(function (u, n, i, v, e, r, s, a, l) { u[r] = {}; u[r].uid = '7155b789-450e-4a0a-83e3-95497bcd427e'; u[r].m = ['identify', 'on', 'ready', 'track']; u[r].queue = []; u[r].f = function(t) { return function() { var l = Array.prototype.slice.call(arguments); l.unshift(t); u[r].queue.push(l); return u[r].queue; }; }; for (var t = 0; t < u[r].m.length; t++) { l = u[r].m[t]; u[r][l] = u[r].f(l); } a = n.createElement(v); a.src = e + '/us-' + u[r].uid + '.js'; a.async = s; n.getElementsByTagName(i)[0].appendChild(a); })(window, document, 'head', 'script', 'https://snippet.sharp-shot.com', 'mbsy', true);</script>
    
    <!-- Ambassador Commission Generation Script -->
    <script type="text/javascript" id="ambassador-commission-generation">
    // Safe localStorage access with error handling
    let amb_data = null;
    try {
        const storedData = localStorage.getItem('mbsy/cookie');
        if (storedData) {
            amb_data = JSON.parse(storedData);
        }
    } catch (error) {
        console.warn('Ambassador: Could not parse localStorage data:', error);
    }
    
    const params = new URLSearchParams(window.location.search);

    let amb_short_code = null;
    let amb_campaign_id = null;
    
    if (amb_data && amb_data['value']) {
        amb_short_code = amb_data['value']['mbsy_cookie_code'];
        amb_campaign_id = amb_data['value']['mbsy_cookie_campaign'];
    };
    
    if (!amb_campaign_id && params.has('campaignid')) {
        amb_campaign_id = params.get('campaignid');
    };
    
    if (!amb_short_code && params.get('mbsy')) {
        amb_short_code = params.get('mbsy');
    };
    
    // Only process if we have valid data
    if (amb_short_code && amb_short_code.includes('+')) {
        amb_short_code = amb_short_code.replace('+', ' ');
    }
    if (amb_short_code && amb_short_code.includes('%')) {
        amb_short_code = amb_short_code.replace('%', ' ');
    }
    
    // Only log warnings if we're in development or if data is expected
    if (window.location.hostname === 'localhost' || window.location.hostname.includes('dev')) {
        if (!amb_campaign_id) console.warn('Ambassador: No campaign ID found');
        if (!amb_short_code) console.warn('Ambassador: No Short Code found');
    }

    //Optional JS API Function To Create A Zero Revenue Event At Signup On The Front End
    //If This Function Is Ommitted, Then An Initial Zero Revenue Commission Must Be Created As A Subtask of Form Submission With /event/record
    //Or The Values Must Be Stored In CRM To Create A Commission With Revenue Later
    function trackAndIdentify() {
        console.log('Ambassador: begin track & identify');
        //A Full List Of Traits Can Be Found At https://docs.getambassador.com/docs/javascript-api#identify
        const email = document.getElementById('email');
    
        const traits = {
            email : email && email.value ? email.value : null
        };

        
        console.log('Ambassador Traits: ', traits);
        if (amb_short_code, amb_campaign_id, email.value) {
            try {
                //ull Documentation For Identify Is Here https://docs.getambassador.com/docs/javascript-api#identify
                mbsy.identify(traits);
                //Full Documentation For Track Is Here https://docs.getambassador.com/docs/javascript-api#track
                mbsy.track({ revenue : 0, eventData1: "Account Created" });
                console.log('Ambassador: Track & Identify Success');
            } catch (err) {
                console.error(err);
            };
        };
    };

    //This code block is unnecessary if not performing the trackAndIdentify function
    let ambassadorForm = null;
    const ambassadorFormInterval = setInterval(()=> {
        //Grab the Form By ID
        ambassadorForm = document.querySelector('form');
            if (ambassadorForm && amb_short_code && amb_campaign_id) {
                ambassadorForm.addEventListener('submit', trackAndIdentify);
                console.log('Ambassador: add submit listener to form')
                clearInterval(ambassadorFormInterval);
            };
    }, 100);
    </script>
